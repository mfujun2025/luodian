name: Update Shops Data

on:
  repository_dispatch:
    types: [merchant-approved]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append approved merchant
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python3 .github/scripts/update_shops.py

      - name: Commit and push
        run: |
          git config user.name "luodian-bot"
          git config user.email "luodian-bot@users.noreply.github.com"
          git add assets/data/shops-data.json
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "自动收录审核通过商家 [skip ci]"
            git push
          fi
