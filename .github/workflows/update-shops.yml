name: Update Shops Data

on:
  repository_dispatch:
    types: [merchant-approved, merchant-rejected]

# 同一时刻只跑一个同步任务，避免连续审核动作并发写同一文件导致 push 冲突
concurrency:
  group: shops-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync approved or rejected merchant
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          EVENT: ${{ github.event.action }}
        run: python3 .github/scripts/update_shops.py

      - name: Commit and push
        run: |
          git config user.name "luodian-bot"
          git config user.email "luodian-bot@users.noreply.github.com"
          git add assets/data/shops-data.json
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "同步审核结果到商家数据 [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
